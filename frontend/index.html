<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A/V Optimizer v.8 Web</title>
  <link rel="stylesheet" href="style.css?v=37">
  <!-- Framework personale degli elementi grafici -->
  <link rel="stylesheet" href="components/AVButton/AVButton.css">
  <link rel="stylesheet" href="components/AVScrollMenu/AVScrollMenu.css">
  <link rel="stylesheet" href="components/AVBootManager/AVBootManager.css">
  <link rel="stylesheet" href="css/dashboard/ui_global_bar.css">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="data:,">
</head>
<body class="app-layout">
  <!-- COMPONENTE 1: Barra Globale -->
  <!-- Inizia compatta, si espande quando si aggiunge la prima cartella -->
  <div id="av-global-bar">
    <!-- Il componente AVDashboardGlobalBar inietterà qui Hamburger, Add, ScrollMenu e Reset -->
  </div>

  <!-- AREA DI LAVORO FLEXBOX -->
  <div id="av-workspace">
    <!-- COMPONENTE 2: Menu Laterale -->
    <!-- Inizia a larghezza 0, si allarga spingendo il canvas -->
    <aside id="av-global-menu" class="av-box">
      <!-- Il componente AVDashboardGlobalMenu inietterà qui i suoi bottoni -->
    </aside>

    <!-- COMPONENTE 3: Canvas -->
    <main id="av-canvas" class="av-box">
      <!-- Il componente AVDashboardCanvas inietterà qui la toolbar interna e le subfolder-card -->
    </main>
  </div>

<script src="js/globals.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/ui_modals.js"></script>
<script src="js/ui_files.js"></script>
<script src="js/main.js"></script>
<script src="js/ui_folder_header.js"></script>
<script src="js/ui_folder_footer_left.js"></script>
<script src="js/ui_folder_footer_right.js"></script>

<!-- Moduli caricati -->
<script type="module" src="js/ui_dashboard.js"></script>
<script type="module" src="js/ui_folders.js"></script>

</body>
</html>
